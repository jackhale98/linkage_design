<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Free, open source, browser-based design and analysis of planar mechanisms, linkages and cams."
    />
    <meta name="theme-color" content="#0f766e" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Linkage Design</title>
    <script>
      // Apply a saved theme before first paint to avoid a flash.
      try {
        const t = JSON.parse(localStorage.getItem('linkage-design:theme') || '"system"');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Linkage Design needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
